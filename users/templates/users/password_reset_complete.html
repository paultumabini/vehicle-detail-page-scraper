{% extends 'users/base_user.html' %}

{% block title %}VDP Scraper | Password updated{% endblock %}

{% block content %}
<!--
  /password-reset-complete/ — PasswordResetCompleteView.

  Shown after a successful password change via the emailed reset link.
  Status-only page: fa-circle-check icon (not _auth_brand_mark.html).
-->
<div class="vdp-auth-page">
  <div class="vdp-auth-card">
    <div class="vdp-auth-brand">
      <i
        class="fa fa-circle-check vdp-auth-status-icon vdp-auth-status-icon--success"
        aria-hidden="true"
      ></i>
      <h1 class="vdp-auth-title">Password updated</h1>
      <p class="vdp-auth-subtitle">Your new password is saved. You can sign in now.</p>
    </div>

    <a href="{% url 'login' %}" class="vdp-auth-submit vdp-auth-submit--link">Sign in</a>
  </div>
</div>
{% endblock content %}
