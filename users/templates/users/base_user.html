{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}VDP Scraper{% endblock %}</title>

    <!--
    Auth shell — /login/, /register/, /logout/, /password-reset/*.
    No app sidebar; shares Inter, FA6, and main.css vdp-auth-* tokens with project/base.html.

    All auth pages extend this file directly (main.css + Alpine). register_login.css/js
    are legacy and must not load here — their global form{} rule breaks vdp-auth-card.

    Form pages include users/_auth_brand_mark.html (spider gradient; replaces profile_login.png).
    Django {# #} must stay on one line (Django 6); use HTML comments in <head>.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="{% static 'css/main.css' %}" />
    <!-- legacy_auth_css/js: unused — kept for backward compatibility if old templates extend base_legacy_auth.html -->
    {% block legacy_auth_css %}{% endblock %}
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'images/favicon-32.png' %}" />

    {% block extra_head %}{% endblock %}
  </head>
  <body class="vdp-auth-body">
    {% block content %}{% endblock %}

    <script
      defer
      src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"
    ></script>
    <!-- legacy_auth_js: unused — register/password pages use Alpine for password toggle -->
    {% block legacy_auth_js %}{% endblock %}
    {% block extra_js %}{% endblock %}
  </body>
</html>
